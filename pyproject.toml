[project]
name = "openbridge"
version = "0.1.0"
description = "Self-extending agent that discovers APIs and deploys MCP servers on-the-fly"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
openbridge = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
